services:
  gsc:
    build: .
    environment:
      SERVER: gsc
      PORT: "8000"
      GSC_KEY_FILE: gsc-service-account.json
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    # Not exposed to host — gateway reaches it via internal network

  gpc:
    build: .
    environment:
      SERVER: gpc
      PORT: "8000"
      GPC_KEY_FILE: gpc-service-account.json
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped

  # Uncomment if running the gateway in the same compose stack:
  # authmcp-gateway:
  #   image: ghcr.io/loglux/authmcp-gateway:latest
  #   ports:
  #     - "9105:8000"
